<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172949">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./global/global.css">
    <link rel="stylesheet" href="./halaman-pembuka/pembuka.css">
    <link rel="stylesheet" href="./kuis1/kuis1.css">
    <link rel="stylesheet" href="./kuis1/landscape.css">
    <link rel="stylesheet" href="./kuis1/portrait.css">
    <title>Alfiyah Quiz</title>
</head>
<body>
    <div class="viewport" id="viewport">
        <div class="frame" id="frame">
            <div class="stage" id="stage">
                <header class="appbar">
                    <div class="brand-lockup">
                        <div class="brand-mark" lang="ar">أ</div>
                        <div>
                            <div class="brand-title">ALFIYAH QUIZ</div>
                            <div class="brand-subtitle">Uji Hafalan dan Pemahaman Bait Alfiyah</div>
                        </div>
                    </div>
                    <div class="appbar-note">أَلْفِيَّةُ ابْنِ مَالِكٍ</div>
                </header>

                <main class="main" id="screens">
                    <div class="boot-status" id="bootStatus">Memuat aplikasi...</div>
                </main>

                <footer class="app-footer">
                    <span>ALFIYAH QUIZ · ©2026 mr.key7@gmail.com · TEBUIRENG3</span>
                    <button class="cache-reset" id="cacheReset" type="button" title="Hapus cache aplikasi" aria-label="Hapus cache aplikasi">↻</button>
                </footer>
            </div>
        </div>

        <div class="zoom-controls" aria-label="Kontrol pembesaran tampilan">
            <button id="zoomOut" type="button" aria-label="Perkecil tampilan" title="Perkecil">−</button>
            <span id="zoomValue">100%</span>
            <button id="zoomIn" type="button" aria-label="Perbesar tampilan" title="Perbesar">+</button>
            <button id="zoomReset" type="button" aria-label="Atur ulang zoom" title="Atur ulang">↺</button>
        </div>
    </div>

    <div class="portrait-notice" id="portraitNotice">
        <div class="portrait-card">
            <div class="rotate-symbol">↻</div>
            <h1>Putar Perangkat</h1>
            <p>Untuk menggunakan Alfiyah Quiz, gunakan posisi layar landscape (mendatar).</p>
        </div>
    </div>

    <script type="module" src="./global/global.js"></script>
</body>
</html>
